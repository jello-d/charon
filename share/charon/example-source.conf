# charon SOURCE -- copy to ~/.config/charon/sources.d/<name>.conf and edit.
# KEY=VALUE, read LITERALLY. One file per tree that charon caches.
#
# YOU PROBABLY DO NOT NEED ONE. A source named 'default' is IMPLICIT, derived
# from CHARON_REMOTE (mount ~/$CHARON_REMOTE, cache ~/.$CHARON_REMOTE), so a
# single-remote install works with profiles alone. Write a file here to add a
# SECOND source, or to point charon at a tree it does not mount itself.
#
# WHY this is separate from the profile: several profiles normally share one
# source (Media and Documents under one mount). The mount path and the remote
# name are ONE fact; keeping them here means two profiles cannot disagree
# about the same tree.

# --- the pair charon reconciles, for every profile using this source ---

# The source root: the authoritative tree. It may be a mount charon manages,
# or one something else manages entirely (see PROVIDER=none below).
MOUNT=~/gdrive

# The local cache root. This is the copy you actually read and write.
CACHE_ROOT=~/.gdrive

# --- how the source comes to exist ---

# rclone  charon mounts the remote itself and can bulk-seed from the API.
# none    BRING YOUR OWN: something else provides the tree (an fstab entry, an
#         automounted NFS or SMB share, a USB disk, or just a local directory).
#         charon will not try to mount or unmount it, and cannot bulk-seed it;
#         it still reconciles, still gates on the tree being live and sane, and
#         still refuses to sync a source that has gone suspiciously empty.
PROVIDER=rclone

# Provider-specific. For rclone, the remote name as `rclone listremotes` prints
# it (without the trailing colon).
REMOTE=gdrive
