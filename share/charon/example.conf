# charon profile -- copy to ~/.config/charon/profiles.d/<name>.conf and edit.
# One file per synced subtree. KEY=VALUE, read LITERALLY (nothing is executed).
# `setup.sh bootstrap` copies this into an empty profiles.d to get you started.

# The subtree path under BOTH the remote mount (~/<remote>) and the local cache
# (~/.<remote>) to keep in sync. Required.
SUBTREE=Documents

# Optional: a working dir symlinked to the cache subtree, so apps read the fast
# local copy instead of the slow FUSE mount. A leading ~/ expands to $HOME.
LINK=~/Documents

# unison timer cadence.
INTERVAL=30m
BOOT=10m
JITTER=2m

# Optional: a subtree rclone-seeded SYNCHRONOUSLY at install (before the timers
# arm), for data a fresh box needs immediately (e.g. a desktop wallpaper).
#SEED_PRIORITY=Documents/important

# Optional: if set, this SUBTREE joins the BACKGROUND full seed at install,
# lower order first. Leave unset to skip the bulk seed for this profile.
SEED_FULL_ORDER=10
