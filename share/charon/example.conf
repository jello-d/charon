# charon PROFILE -- copy to ~/.config/charon/profiles.d/<name>.conf and edit.
# One file per reconciled subtree. KEY=VALUE, read LITERALLY (nothing is
# executed, nothing is word-split, a value with spaces needs no quoting).
# `setup.sh bootstrap` copies this into an empty profiles.d to get you started.
#
# A profile answers TWO questions: WHAT to reconcile, and with WHAT POLICY.
# WHERE the source comes from is a SOURCE (see example-source.conf); several
# profiles normally share one.

# --- what to reconcile ---

# <source>:<subtree>. The subtree is relative to the source's MOUNT and
# CACHE_ROOT. Omit the ":<subtree>" to reconcile the whole source.
SOURCE=default:Documents

# Legacy shorthand, still supported and equivalent to SOURCE=default:<value>:
#SUBTREE=Documents

# --- cadence ---
INTERVAL=30m
BOOT=10m
JITTER=2m

# --- seeding (optional; needs a source whose provider can bulk-copy) ---

# A subtree copied straight from the remote SYNCHRONOUSLY at install, for data
# a fresh box needs immediately (a desktop wallpaper, say).
#SEED_PRIORITY=Documents/important

# If set, this subtree joins the BACKGROUND full seed at install, lower first.
SEED_FULL_ORDER=10

# --- policy: three knobs, in charon's vocabulary rather than the engine's ---

# Exclude paths. REPEATABLE: one pattern per line. A value containing '/' is a
# path from the root of the subtree; anything else matches that name at any
# depth. Note charon already excludes the reconciler's own temp files.
#IGNORE=*.tmp
#IGNORE=Archive/scratch

# Who wins when BOTH sides changed since the last pass.
#   remote  the source wins (default). The overwritten local version is kept
#           beside it as a copy, so nothing is lost, and the copy is LOCAL.
#   local   the cache wins. Careful: the overwritten copy then lands on the
#           REMOTE, which is a write you would otherwise not be making.
#   newer   whichever side has the newer mtime wins. Carries the SAME caveat
#           as `local` whenever the cache happens to be the newer side: the
#           overwritten remote version is kept as a copy ON THE REMOTE.
#CONFLICT=remote

# Whether a deletion on one side is mirrored to the other.
#   propagate  delete the other copy too (default).
#   never      a deletion is never propagated, so an accidental rm cannot
#              reach the far side. MEASURED BEHAVIOUR, which is blunter than
#              it sounds: the far copy survives, but the path becomes an
#              unresolved conflict and the profile FAILS on every pass until a
#              human settles it (restore the file, or delete it on both sides).
#              It does NOT silently restore the missing copy. That fault is the
#              point -- you asked for deletions never to propagate, so charon
#              refuses to guess which side you meant.
#DELETE=propagate

# NOTE: there is deliberately no working-link key. charon manages a cache;
# where your desktop surfaces that cache is layout, and layout is yours.
