# charon global settings -- ~/.config/charon/charon.conf
#
# OPTIONAL. Everything here has a default, and the defaults are what charon
# does with no such file at all. This holds only the handful of facts that
# belong to the INSTALL rather than to any one source or profile; which tree to
# cache lives in sources.d/, what to reconcile in profiles.d/.
#
# Read literally, KEY=VALUE, nothing executed.

# Whether `charon install` arms the daily sweep of orphaned Unison transfer
# temps (.unison.*.unison.tmp). Default: daily.
#
# Those temps are not content. Unison stages an in-flight file as one in the
# DESTINATION directory and renames it into place, so it cannot be kept off a
# remote replica. Unison deletes its own temp as soon as it next propagates
# that path, and charon cleans up surgically after any path it watches settle,
# so the daily sweep is only a BACKSTOP for what neither could know about.
#
# `off` installs no timer and collects nothing automatically. `charon sweep`
# still works by hand, and `charon check` reports that as correct rather than
# as drift -- your choice is not something charon will argue with.
#SWEEP=daily

# How old, in minutes, an orphaned temp must be before the sweep removes it.
# Default: 1440 (one day).
#
# The gate is the safety property, not tidiness: a RECENT temp may be the live
# resume point of an interrupted transfer, and on a shared remote it may belong
# to another machine. Read at run time, so the timed sweep honours it too.
# A value that is not a whole number of minutes is REFUSED rather than guessed
# at, because anything landing on zero would match every temp including the
# ones still in use.
#CRUMB_AGE_MIN=1440
